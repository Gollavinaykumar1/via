name: VIA CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          OLLAMA_URL: http://localhost:11434/api/generate
          POSTGRES_HOST: localhost
          JWT_SECRET_KEY: test-secret-key

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install flake8

      - name: Lint backend
        run: flake8 backend/ --max-line-length=200 --ignore=E501,W503,W504,E402,E241,E272,E221,E401,E302,E303,E711,E712,E721,W292,E704,E701,E722 --count

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t via-api .
